packages:
  - "packages/*"

nodeLinker: hoisted
injectWorkspacePackages: true

# pnpm 10+ requires dependency install scripts to be opted into explicitly.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false

catalog:
  '@cloudflare/vitest-pool-workers': ^0.12
  '@cloudflare/workers-types': ^4
  '@testing-library/react': ^16
  '@types/node': ^22
  '@types/react': ^19
  eslint: ^9
  eslint-config-prettier: ^10
  eslint-plugin-unused-imports: ^4
  fast-diff: ^1.3.0
  hono: ^4
  jsdom: ^26
  lucide: ^1.57.0
  nanoid: ^5.1.7
  prettier: ^3
  react: ^19
  react-dom: ^19
  tsup: ^8
  typescript: ~6.0.3
  typescript-eslint: ^8
  vitest: ^3
  wrangler: ^4
  yjs: ^13.6.27
  zod: 4.4.1
