packages:
  - "packages/*"

nodeLinker: hoisted
injectWorkspacePackages: true

# pnpm 10+ requires dependency install scripts to be opted into explicitly.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false

catalog:
  '@cloudflare/vitest-pool-workers': ^0.12
  '@cloudflare/workers-types': ^4
  '@types/node': ^22
  eslint: ^9
  eslint-config-prettier: ^10
  eslint-plugin-unused-imports: ^4
  hono: ^4
  lucide: ^1.57.0
  nanoid: ^5.1.7
  prettier: ^3
  tsup: ^8
  typescript: ~6.0.3
  typescript-eslint: ^8
  vitest: ^3
  wrangler: ^4
  yjs: ^13.6.27
  zod: 4.4.1
